# Netlify: plain static site, published from the repo root with no build step.
[build]
  publish = "."
  command = ""

# Repo files that aren't part of the website
[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

# Basic hardening for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# File names aren't fingerprinted, so media is cached for a week rather than
# forever; fonts never change, so they're cached for a year.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
